services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lpmon-dev}
      POSTGRES_DB: lpmon
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpmon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
